name: Build
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: ./utils/build_locally.sh linux
      - name: Upload
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/openturns/openturns.github.io.git /tmp/io
          mkdir -p /tmp/io/otrobopt/master
          cp -r html/* /tmp/io/otrobopt/master
          cd /tmp/io
          touch .nojekyll
          git config user.email "support@gh.com"
          git config user.name "GitHub Actions"
          git add -A .
          git commit -a -m "GitHub Actions build ${GITHUB_REPOSITORY} ${GITHUB_RUN_ID}" || exit 0
          git push --quiet origin master > /dev/null 2>&1

  mingw:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: ./utils/build_locally.sh mingw

  macos:
    runs-on: macos-latest
    env:
      MAKEFLAGS: -j3
    steps:
    - uses: actions/checkout@v7
    - run: |
        brew update
        brew install openturns
    - run: |
        cmake \
        -DCMAKE_INSTALL_PREFIX=~/.local \
        -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
        -DBUILD_PYTHON=OFF .
        make install
        make tests
        ctest ${MAKEFLAGS} --output-on-failure --timeout 100 --schedule-random

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          # The job only calls `conda install` into base via condabin on PATH
          # and never activates an env, so skip `conda init --all` which
          # currently fails on Windows (exit code 1, `needs sudo ... conda.exe`)
          activate-environment: ""
          auto-activate: false
          run-init: false
          remove-profiles: false
      - name: Install
        shell: cmd
        run: |
          conda install -y cmake swig ninja openturns matplotlib-base
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: |
          set "LIB=C:\Users\runneradmin\miniconda3\Library\lib;%LIB%"
          set "INCLUDE=C:\Users\runneradmin\miniconda3\Library\include;%INCLUDE%"
          set "PATH=C:\Users\runneradmin\miniconda3\Library\bin;%PATH%"
          cmake -G Ninja -B . -LAH ^
           -DCMAKE_INSTALL_PREFIX="C:/Users/runneradmin/miniconda3/Library" ^
           -DCMAKE_PREFIX_PATH="C:/Users/runneradmin/miniconda3/Library" ^
           -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /W3 /GR /EHsc /WX" ^
           -DCMAKE_UNITY_BUILD=ON ^
           -DPython_FIND_STRATEGY=LOCATION -DPython_ROOT_DIR="C:/Users/runneradmin/miniconda3" || exit 1
          cmake --build . --target install --parallel 4 || exit 1
          ctest --output-on-failure --timeout 100 -E cppcheck -j2 --schedule-random
